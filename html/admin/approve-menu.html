    <!-- ==============approve menu page content ============== -->
   <main class="approve-container">
 
        <!-- Header Banner -->
        <div class="page-header">
            <h1 class="thaipattaya">Current requests</h1>
            <span class="request-count" id="request-count">0</span>
        </div>
 
        <!-- List Panel -->
        <div class="list-panel">
 
            <!-- Search & Sort Bar -->
            <div class="search-sort-bar">
                <div class="search-box">
                    <span class="thai search-label">ค้นหา</span>
                    <input type="text" class="search-input thai" placeholder="ค้นหาเมนูอาหาร..." id="searchInput">
                    <button class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
                </div>
                <div class="status-filter" id="statusFilter">
                    <button class="status-btn active" type="button" data-status="all">All requests</button>
                    <button class="status-btn" type="button" data-status="pending">Pending requests</button>
                    <button class="status-btn" type="button" data-status="approved">Approved requests</button>
                    <button class="status-btn" type="button" data-status="rejected">Rejected requests</button>
                </div>
                <div class="sort-wrapper">
                    <button class="sort-btn" id="sortBtn"><i class="fa-solid fa-list"></i></button>
                    <div class="sort-dropdown hidden" id="sortDropdown">
                        <div class="sort-option" data-sort="asc">Ascending</div>
                        <div class="sort-option active" data-sort="desc">Descending</div>
                    </div>
                </div>
            </div>
 
            <!-- Request List -->
            <div class="request-list" id="requestList">
                <!-- Request items rendered from MongoDB -->
            </div>
        </div>
    </main>
