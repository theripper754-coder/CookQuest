    <script>
        // Force unregister all Service Workers and clear caches to bypass old cached files
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(registrations => {

            });
        }
        if (window.caches) {
            caches.keys().then(keys => { for (let key of keys) caches.delete(key); });
        }
    </script>

     <div class="container-main">
        <div class="search-container">
            <span class="search-label thai">ค้นหา</span>
            <input type="text" class="search-input thai" placeholder="ชื่อเมนู, ส่วนผสม">
            <button class="search-button">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>

        <nav class="top-nav">
            <a href="q-all.html?tab=all" class="nav-link"><span class="thai">ทั้งหมด</span></a>
            <a href="q-all.html?tab=pending" class="nav-link"><span class="thai">รอดำเนินการ</span></a>

            <a href="q-self.html" class="nav-link active"><span class="thai">บันทึกสูตร</span></a>
        </nav>

        <main class="content-container" id="detail-main">
            <span class="category-title thai" style="margin-bottom: 15px; padding: 0;">บันทึกสูตรอาหารของคุณ</span>
            <div style="display: flex; justify-content: center; margin-bottom: 20px;">
                <button class="btn-add-menu" onclick="openAddMenu()">+</button>
            </div>
            <div class="quest-section" id="menuGrid"></div>
            <!-- ADD POPUP -->
            <div class="am-overlay hidden" id="amOverlay">
                <div class="am-popup">
            
                <div class="am-popup-header">
                    <span class="am-popup-title thai">เพิ่มเมนูใหม่</span>
                    <button class="am-close-btn" onclick="closeAddMenu()"><i class="fa-solid fa-xmark"></i></button>
                </div>
            
                <div class="am-field">
                    <input type="text" class="am-input" placeholder="ชื่อเมนู" id="amName">
                </div>
            
                <div class="am-upload-main" id="amMainBox" onclick="document.getElementById('amMainFile').click()">
                    <i class="fa-regular fa-image am-upload-icon" id="amMainIcon"></i>
                    <span class="am-upload-label thai" id="amMainLabel">เพิ่มไฟล์รูปภาพ</span>
                    <img class="am-upload-preview hidden" id="amMainPreview" alt="preview">
                    <input type="file" id="amMainFile" accept="image/*" style="display:none" onchange="previewMainImg(event)">
                </div>
                <div class="am-upload-actions hidden" id="amMainActions">
                    <label class="am-btn-change thai" for="amMainFile"><i class="fa-solid fa-pen"></i> เปลี่ยนรูป</label>
                    <button class="am-btn-delete thai" onclick="removeMainImg()"><i class="fa-solid fa-trash"></i> ลบรูป</button>
                </div>
            
                <div class="am-row-three">
                    <div class="am-field">
                    <input type="number" class="am-input" placeholder="จำนวน (จาน)" id="amQty" min="1">
                    </div>
                    <div class="am-field">
                    <input type="number" class="am-input" placeholder="เวลาเตรียม (นาที)" id="amPrepTime" min="0">
                    </div>
                    <div class="am-field">
                    <input type="number" class="am-input" placeholder="เวลาปรุง (นาที)" id="amCookTime" min="0">
                    </div>
                </div>
            

            
                <div class="am-section">
                    <div class="am-sec-header">
                    <span class="thai">วัตถุดิบ</span>
                    <button class="am-sec-plus" onclick="amAddIngredient()">+</button>
                    </div>
                    <div class="am-sec-body" id="amIngList"></div>
                </div>
            
                <div class="am-section">
                    <div class="am-sec-header">
                    <span class="thai">ขั้นตอนการทำ</span>
                    <button class="am-sec-plus" onclick="amAddStep()">+</button>
                    </div>
                    <div class="am-sec-body"><div id="amStepList"></div></div>
                </div>
            
                <div class="am-taste-row">
                    <span class="am-taste-label">Taste :</span>
                    <div class="am-taste-stars" id="amTasteStars">
                    <i class="fa-regular fa-star am-star" data-val="1"></i>
                    <i class="fa-regular fa-star am-star" data-val="2"></i>
                    <i class="fa-regular fa-star am-star" data-val="3"></i>
                    <i class="fa-regular fa-star am-star" data-val="4"></i>
                    <i class="fa-regular fa-star am-star" data-val="5"></i>
                    </div>
                </div>
            
                <div class="am-taste-tags" id="amTasteTags">
                    <button class="am-ttag thai">หวาน</button>
                    <button class="am-ttag thai">เค็ม</button>
                    <button class="am-ttag thai">เปรี้ยว</button>
                    <button class="am-ttag thai">ขม</button>
                    <button class="am-ttag thai">อูมามิ</button>
                    <button class="am-ttag thai">เผ็ด</button>
                </div>
            
                <div class="am-field">
                    <textarea class="am-input am-textarea thai" placeholder="รสชาติอาหารของคุณเป็นอย่างไรบ้าง" id="amReview" rows="2"></textarea>
                </div>
            
                <div class="am-bottom-row">
                    <button class="am-btn-submit thai" onclick="amSubmit()">Add</button>
                    <button class="am-btn-cancel thai" onclick="closeAddMenu()">Cancel</button>
                </div>
            
                </div>
            </div>
            
            <!-- VIEW POPUP -->
            <div class="am-overlay hidden" id="viewOverlay">
                <div class="am-popup">
            
                <div class="am-popup-header">
                    <span class="am-popup-title thai" id="viewTitle"></span>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <button class="am-close-btn" style="color:var(--primary-color); font-size:1.2rem;" id="btnEditMenu" title="แก้ไข"><i class="fa-solid fa-pen"></i></button>
                        <button class="am-close-btn" style="color:red; font-size:1.2rem;" id="btnDeleteMenu" title="ลบ"><i class="fa-solid fa-trash"></i></button>
                        <button class="am-close-btn" onclick="closeViewMenu()"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>
            
                <div id="viewImgWrap" class="hidden">
                    <img class="view-main-img" id="viewImg" alt="menu">
                </div>
            
                <div class="view-info-row" id="viewInfoRow">
                    <span class="view-info-item thai" id="viewQtyInfo"></span>
                    <span class="view-info-item thai" id="viewPrepTimeInfo"></span>
                    <span class="view-info-item thai" id="viewCookTimeInfo"></span>
                </div>
            
                <div id="viewIngSection" class="hidden">
                    <div class="am-section">
                    <div class="am-sec-header"><span class="thai">วัตถุดิบ</span></div>
                    <div class="am-sec-body" id="viewIngList"></div>
                    </div>
                </div>

                <div id="viewStepSection" class="hidden">
                    <div class="am-section">
                    <div class="am-sec-header"><span class="thai">ขั้นตอนการทำ</span></div>
                    <div class="am-sec-body" id="viewStepList"></div>
                    </div>
                </div>
            
                <div id="viewTasteSection" class="hidden">
                    <div class="am-taste-row">
                    <span class="am-taste-label">Taste :</span>
                    <div class="am-taste-stars" id="viewTasteStars"></div>
                    </div>
                    <div class="am-taste-tags" id="viewTasteTags"></div>
                </div>
            
                <div id="viewReviewSection" class="hidden">
                    <div class="view-review-box thai" id="viewReviewText"></div>
                </div>
            
                </div>
            </div>
        </main>
